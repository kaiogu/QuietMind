apply plugin: 'com.android.application'

android {
    namespace 'ragone.io.quietmind'
    compileSdk 34

    defaultConfig {
        applicationId "ragone.io.quietmind"
        minSdk 21
        targetSdk 34
        versionCode 10
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'

    // AndroidX (replaces the old android.support.* libraries)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.3'

    // Third-party libs (unmaintained, kept for now — will be replaced in Phase 3)
    implementation 'com.lantouzi.wheelview:library:1.1.1'
    implementation 'cn.pedant.sweetalert:library:1.3'
    implementation 'com.github.amlcurran.showcaseview:library:5.4.1'

    // Updated to a version available on mavenCentral
    implementation 'me.relex:circleindicator:2.1.6'
}
